<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" font-family="system-ui, -apple-system, sans-serif" font-size="12">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#555"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#4A90D9"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#7BC67E"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="330" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Write Routing — CDI Decorator Interception</text>

  <!-- Agent -->
  <rect x="20" y="60" width="100" height="40" rx="6" fill="#f0f0f0" stroke="#aaa"/>
  <text x="70" y="84" text-anchor="middle" font-weight="bold" fill="#333">Agent</text>

  <!-- Arrow to decorator -->
  <line x1="120" y1="80" x2="175" y2="80" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="148" y="72" font-size="10" fill="#888">dispatch()</text>

  <!-- Decorator box -->
  <rect x="180" y="48" width="180" height="64" rx="6" fill="#FFF8E7" stroke="#E8A838" stroke-width="1.5"/>
  <text x="270" y="68" text-anchor="middle" font-weight="bold" fill="#C88420">WriteRoutingDecorator</text>
  <text x="270" y="84" text-anchor="middle" font-size="11" fill="#888">quorum check</text>
  <text x="270" y="98" text-anchor="middle" font-size="11" fill="#888">owner = ring.owner(channelId)</text>

  <!-- Decision diamond -->
  <polygon points="270,140 320,170 270,200 220,170" fill="#FFF" stroke="#888" stroke-width="1.5"/>
  <text x="270" y="174" text-anchor="middle" font-size="11" fill="#333">local?</text>

  <!-- Arrow from decorator to diamond -->
  <line x1="270" y1="112" x2="270" y2="140" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- YES path — local dispatch -->
  <line x1="220" y1="170" x2="80" y2="170" stroke="#4A90D9" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="150" y="162" font-size="11" font-weight="bold" fill="#4A90D9">yes</text>

  <rect x="20" y="150" width="120" height="40" rx="6" fill="#E8F0FE" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="80" y="174" text-anchor="middle" font-weight="bold" fill="#4A90D9">MessageService</text>

  <!-- Local result -->
  <rect x="20" y="220" width="120" height="36" rx="6" fill="#f8f8f8" stroke="#bbb"/>
  <text x="80" y="242" text-anchor="middle" font-size="11" fill="#555">DispatchResult</text>
  <line x1="80" y1="190" x2="80" y2="220" stroke="#4A90D9" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- pg_notify from local -->
  <rect x="20" y="282" width="120" height="30" rx="6" fill="#E8F5E9" stroke="#7BC67E" stroke-width="1.5"/>
  <text x="80" y="302" text-anchor="middle" font-size="11" fill="#5AA55D">pg_notify → peers</text>
  <line x1="80" y1="256" x2="80" y2="282" stroke="#7BC67E" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- NO path — proxy to remote -->
  <line x1="320" y1="170" x2="420" y2="170" stroke="#E8A838" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="370" y="162" font-size="11" font-weight="bold" fill="#C88420">no</text>

  <!-- Proxy client -->
  <rect x="425" y="150" width="130" height="40" rx="6" fill="#FFF8E7" stroke="#E8A838" stroke-width="1.5"/>
  <text x="490" y="174" text-anchor="middle" font-weight="bold" fill="#C88420">WriteProxyClient</text>

  <!-- Arrow to remote node -->
  <line x1="490" y1="190" x2="490" y2="230" stroke="#E8A838" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="510" y="214" font-size="10" fill="#888">HTTP POST</text>

  <!-- Remote node box -->
  <rect x="410" y="235" width="160" height="80" rx="6" fill="#f8f8f8" stroke="#aaa" stroke-width="1.5"/>
  <text x="490" y="258" text-anchor="middle" font-weight="bold" fill="#333">Owner Node</text>

  <rect x="425" y="267" width="130" height="30" rx="4" fill="#E8F0FE" stroke="#4A90D9"/>
  <text x="490" y="286" text-anchor="middle" font-size="11" fill="#4A90D9">MessageService</text>

  <!-- pg_notify from remote -->
  <rect x="425" y="338" width="130" height="30" rx="6" fill="#E8F5E9" stroke="#7BC67E" stroke-width="1.5"/>
  <text x="490" y="358" text-anchor="middle" font-size="11" fill="#5AA55D">pg_notify → peers</text>
  <line x1="490" y1="315" x2="490" y2="338" stroke="#7BC67E" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Result back to proxy -->
  <line x1="570" y1="280" x2="620" y2="280" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="620" y1="280" x2="620" y2="80" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="620" y1="80" x2="365" y2="80" stroke="#888" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="630" y="180" font-size="10" fill="#888" transform="rotate(90, 630, 180)">response</text>
</svg>
