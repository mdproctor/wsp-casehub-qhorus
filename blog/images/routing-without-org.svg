<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <marker id="arrow1" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#64748b" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="340" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Without org-awareness: best capability match wins</text>

  <!-- Sender -->
  <rect x="30" y="120" width="120" height="56" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="90" y="145" text-anchor="middle" font-size="12" font-weight="600" fill="#0c4a6e">Sender</text>
  <text x="90" y="162" text-anchor="middle" font-size="10" fill="#475569">Team Alpha</text>

  <!-- RoutingBridge -->
  <rect x="220" y="110" width="140" height="76" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="290" y="138" text-anchor="middle" font-size="12" font-weight="600" fill="#713f12">RoutingBridge</text>
  <text x="290" y="156" text-anchor="middle" font-size="10" fill="#78716c">role:analyst</text>
  <text x="290" y="172" text-anchor="middle" font-size="10" fill="#78716c">find all matches</text>

  <!-- Arrow sender to bridge -->
  <line x1="150" y1="148" x2="215" y2="148" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <text x="182" y="140" text-anchor="middle" font-size="9" fill="#64748b">COMMAND</text>

  <!-- Candidates -->
  <rect x="440" y="50" width="200" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="540" y="72" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">analyst-1 (Team Alpha)</text>
  <text x="540" y="90" text-anchor="middle" font-size="10" fill="#475569">trust: 0.7</text>

  <rect x="440" y="130" width="200" height="56" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="540" y="152" text-anchor="middle" font-size="11" font-weight="700" fill="#7f1d1d">analyst-2 (Team Beta)</text>
  <text x="540" y="170" text-anchor="middle" font-size="10" fill="#475569">trust: 0.9 -- SELECTED</text>

  <rect x="440" y="210" width="200" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="540" y="232" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">analyst-3 (Team Alpha)</text>
  <text x="540" y="250" text-anchor="middle" font-size="10" fill="#475569">trust: 0.6</text>

  <!-- Arrows bridge to candidates -->
  <line x1="360" y1="135" x2="435" y2="78" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow1)"/>
  <line x1="360" y1="148" x2="435" y2="158" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow1)"/>
  <line x1="360" y1="165" x2="435" y2="238" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow1)"/>

  <!-- Annotation -->
  <text x="340" y="310" text-anchor="middle" font-size="11" fill="#dc2626" font-style="italic">Highest trust score selected -- but analyst-2 is on a different team</text>
  <text x="340" y="328" text-anchor="middle" font-size="11" fill="#dc2626" font-style="italic">and has no shared context with the sender</text>
</svg>
