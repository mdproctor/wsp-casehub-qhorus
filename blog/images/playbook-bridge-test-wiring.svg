<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <!-- Background -->
  <rect width="720" height="420" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a2e">@QuarkusTest Wiring — playbook-bridge</text>

  <!-- Real beans (green zone) -->
  <rect x="30" y="50" width="240" height="200" rx="6" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5"/>
  <text x="150" y="72" text-anchor="middle" font-weight="600" fill="#2e7d32" font-size="12">REAL BEANS (under test)</text>

  <rect x="50" y="85" width="200" height="28" rx="4" fill="white" stroke="#66bb6a"/>
  <text x="150" y="104" text-anchor="middle" fill="#1b5e20" font-size="11">JpaProtocolDefinitionStore</text>

  <rect x="50" y="120" width="200" height="28" rx="4" fill="white" stroke="#66bb6a"/>
  <text x="150" y="139" text-anchor="middle" fill="#1b5e20" font-size="11">PlaybookProtocolResolver</text>

  <rect x="50" y="155" width="200" height="28" rx="4" fill="white" stroke="#66bb6a"/>
  <text x="150" y="174" text-anchor="middle" fill="#1b5e20" font-size="11">CompilationCache</text>

  <rect x="50" y="190" width="200" height="28" rx="4" fill="white" stroke="#66bb6a"/>
  <text x="150" y="209" text-anchor="middle" fill="#1b5e20" font-size="11">ProtocolDefinitionResource</text>

  <rect x="50" y="225" width="95" height="18" rx="3" fill="#c8e6c9"/>
  <text x="98" y="238" text-anchor="middle" fill="#2e7d32" font-size="9">H2 (qhorus PU)</text>

  <rect x="155" y="225" width="95" height="18" rx="3" fill="#c8e6c9"/>
  <text x="203" y="238" text-anchor="middle" fill="#2e7d32" font-size="9">entity pkg added</text>

  <!-- InMemory alternatives (blue zone) -->
  <rect x="290" y="50" width="200" height="200" rx="6" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5"/>
  <text x="390" y="72" text-anchor="middle" font-weight="600" fill="#1565c0" font-size="12">IN-MEMORY ALTERNATIVES</text>

  <rect x="305" y="85" width="170" height="24" rx="4" fill="white" stroke="#64b5f6"/>
  <text x="390" y="102" text-anchor="middle" fill="#0d47a1" font-size="10">InMemoryChannelStore</text>

  <rect x="305" y="114" width="170" height="24" rx="4" fill="white" stroke="#64b5f6"/>
  <text x="390" y="131" text-anchor="middle" fill="#0d47a1" font-size="10">InMemoryMessageStore</text>

  <rect x="305" y="143" width="170" height="24" rx="4" fill="white" stroke="#64b5f6"/>
  <text x="390" y="160" text-anchor="middle" fill="#0d47a1" font-size="10">InMemoryInstanceStore</text>

  <rect x="305" y="172" width="170" height="24" rx="4" fill="white" stroke="#64b5f6"/>
  <text x="390" y="189" text-anchor="middle" fill="#0d47a1" font-size="10">InMemoryCommitmentStore</text>

  <rect x="305" y="201" width="170" height="24" rx="4" fill="white" stroke="#64b5f6"/>
  <text x="390" y="218" text-anchor="middle" fill="#0d47a1" font-size="10">+ 8 more cross-tenant stores</text>

  <!-- Excluded (red zone) -->
  <rect x="510" y="50" width="190" height="130" rx="6" fill="#ffebee" stroke="#ef5350" stroke-width="1.5"/>
  <text x="605" y="72" text-anchor="middle" font-weight="600" fill="#c62828" font-size="12">EXCLUDED</text>

  <rect x="525" y="85" width="160" height="24" rx="4" fill="white" stroke="#ef9a9a"/>
  <text x="605" y="102" text-anchor="middle" fill="#b71c1c" font-size="10">TwilioSmsConnector</text>

  <rect x="525" y="114" width="160" height="24" rx="4" fill="white" stroke="#ef9a9a"/>
  <text x="605" y="131" text-anchor="middle" fill="#b71c1c" font-size="10">JpaLedgerEntryRepository</text>

  <rect x="525" y="143" width="160" height="24" rx="4" fill="white" stroke="#ef9a9a"/>
  <text x="605" y="160" text-anchor="middle" fill="#b71c1c" font-size="10">ReactiveAgentIdentity...</text>

  <!-- Mocked (orange zone) -->
  <rect x="510" y="195" width="190" height="55" rx="6" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5"/>
  <text x="605" y="217" text-anchor="middle" font-weight="600" fill="#e65100" font-size="12">MOCKED</text>

  <rect x="525" y="228" width="160" height="18" rx="3" fill="white" stroke="#ffb74d"/>
  <text x="605" y="241" text-anchor="middle" fill="#bf360c" font-size="10">CurrentPrincipal (@InjectMock)</text>

  <!-- Arrows showing resolution -->
  <line x1="250" y1="100" x2="290" y2="100" stroke="#9e9e9e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="250" y1="135" x2="290" y2="135" stroke="#9e9e9e" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Bottom: test classes -->
  <rect x="30" y="275" width="660" height="130" rx="6" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1.5"/>
  <text x="360" y="297" text-anchor="middle" font-weight="600" fill="#6a1b9a" font-size="12">TEST CLASSES</text>

  <rect x="50" y="310" width="190" height="40" rx="4" fill="white" stroke="#ba68c8"/>
  <text x="145" y="327" text-anchor="middle" fill="#4a148c" font-size="10" font-weight="600">CdiWiringTest</text>
  <text x="145" y="343" text-anchor="middle" fill="#7b1fa2" font-size="9">beans injectable? JPA selected?</text>

  <rect x="260" y="310" width="190" height="40" rx="4" fill="white" stroke="#ba68c8"/>
  <text x="355" y="327" text-anchor="middle" fill="#4a148c" font-size="10" font-weight="600">JpaStoreTest (@TestProfile)</text>
  <text x="355" y="343" text-anchor="middle" fill="#7b1fa2" font-size="9">CRUD, upsert, tenancy isolation</text>

  <rect x="470" y="310" width="210" height="40" rx="4" fill="white" stroke="#ba68c8"/>
  <text x="575" y="327" text-anchor="middle" fill="#4a148c" font-size="10" font-weight="600">ResourceIntegrationTest</text>
  <text x="575" y="343" text-anchor="middle" fill="#7b1fa2" font-size="9">REST Assured: HTTP round-trip</text>

  <rect x="50" y="360" width="300" height="35" rx="4" fill="white" stroke="#ba68c8"/>
  <text x="200" y="377" text-anchor="middle" fill="#4a148c" font-size="10" font-weight="600">Recovery tests (CDI-free, in LifecycleHandlerTest)</text>
  <text x="200" y="390" text-anchor="middle" fill="#7b1fa2" font-size="9">past-due deadlines, partial expiry, empty history</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9e9e9e"/>
    </marker>
  </defs>
</svg>
