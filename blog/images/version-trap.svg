<svg viewBox="0 0 620 420" xmlns="http://www.w3.org/2000/svg" style="font-family:monospace;font-size:13px">
  <text x="310" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">The @Version detached-entity trap</text>

  <rect x="20" y="40" width="180" height="40" rx="6" fill="#e8f0fe" stroke="#4477aa"/>
  <text x="110" y="56" text-anchor="middle" fill="#333" font-size="11">1. DB row</text>
  <text x="110" y="70" text-anchor="middle" fill="#4477aa" font-size="11" font-weight="bold">version = 0</text>

  <line x1="200" y1="60" x2="230" y2="60" stroke="#666" stroke-width="1" marker-end="url(#arr3)"/>

  <rect x="230" y="40" width="180" height="40" rx="6" fill="#e8f0fe" stroke="#4477aa"/>
  <text x="320" y="56" text-anchor="middle" fill="#333" font-size="11">2. findLastMessage()</text>
  <text x="320" y="70" text-anchor="middle" fill="#4477aa" font-size="11">→ managed entity</text>

  <line x1="410" y1="60" x2="440" y2="60" stroke="#666" stroke-width="1" marker-end="url(#arr3)"/>

  <rect x="440" y="40" width="160" height="40" rx="6" fill="#e8f0fe" stroke="#4477aa"/>
  <text x="520" y="56" text-anchor="middle" fill="#333" font-size="11">3. .toDomain()</text>
  <text x="520" y="70" text-anchor="middle" fill="#4477aa" font-size="11">→ Message record</text>

  <line x1="520" y1="80" x2="520" y2="110" stroke="#666" stroke-width="1" marker-end="url(#arr3)"/>

  <rect x="380" y="110" width="220" height="40" rx="6" fill="#e8f0fe" stroke="#4477aa"/>
  <text x="490" y="126" text-anchor="middle" fill="#333" font-size="11">4. toBuilder().build()</text>
  <text x="490" y="140" text-anchor="middle" fill="#4477aa" font-size="11">→ new Message record (v=0)</text>

  <line x1="490" y1="150" x2="490" y2="180" stroke="#666" stroke-width="1" marker-end="url(#arr3)"/>

  <rect x="340" y="180" width="280" height="40" rx="6" fill="#fff3cd" stroke="#cc8800"/>
  <text x="480" y="196" text-anchor="middle" fill="#333" font-size="11">5. MessageEntity.fromDomain()</text>
  <text x="480" y="210" text-anchor="middle" fill="#cc8800" font-size="11" font-weight="bold">→ NEW object (never in L1 cache)</text>

  <line x1="480" y1="220" x2="480" y2="250" stroke="#666" stroke-width="1" marker-end="url(#arr3)"/>

  <rect x="340" y="250" width="260" height="40" rx="6" fill="#fff3cd" stroke="#cc8800"/>
  <text x="470" y="266" text-anchor="middle" fill="#333" font-size="11">6. em.merge(entity)</text>
  <text x="470" y="280" text-anchor="middle" fill="#cc8800" font-size="11">Hibernate: "is this the same entity?"</text>

  <line x1="400" y1="290" x2="200" y2="320" stroke="#44aa44" stroke-width="1.5" marker-end="url(#arr3)"/>
  <line x1="530" y1="290" x2="530" y2="320" stroke="#aa4444" stroke-width="1.5" marker-end="url(#arr3)"/>

  <rect x="60" y="320" width="220" height="50" rx="6" fill="#ddffdd" stroke="#44aa44"/>
  <text x="170" y="338" text-anchor="middle" fill="#333" font-size="11">Expected: copy fields to</text>
  <text x="170" y="352" text-anchor="middle" fill="#333" font-size="11">managed entity, auto-increment</text>
  <text x="170" y="366" text-anchor="middle" fill="#44aa44" font-size="11" font-weight="bold">✓ version 0 → 1</text>

  <rect x="400" y="320" width="210" height="50" rx="6" fill="#ffdddd" stroke="#aa4444"/>
  <text x="505" y="338" text-anchor="middle" fill="#333" font-size="11">Actual: version comparison</text>
  <text x="505" y="352" text-anchor="middle" fill="#333" font-size="11">fails on merge semantics</text>
  <text x="505" y="366" text-anchor="middle" fill="#aa4444" font-size="11" font-weight="bold">✗ StaleObjectStateException</text>

  <text x="310" y="408" text-anchor="middle" fill="#666" font-size="11" font-style="italic">The entity was never loaded — it was constructed. Hibernate doesn't trust it.</text>

  <defs><marker id="arr3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="currentColor" stroke-width="1"/></marker></defs>
</svg>
