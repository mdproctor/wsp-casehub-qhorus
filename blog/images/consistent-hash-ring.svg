<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#666"/>
    </marker>
  </defs>

  <!-- Ring -->
  <circle cx="260" cy="220" r="160" fill="none" stroke="#ddd" stroke-width="2"/>

  <!-- Node arcs — colored segments showing ownership -->
  <!-- node-1 (blue): roughly 0° to 120° -->
  <path d="M420,220 A160,160 0 0,1 180,82" fill="none" stroke="#4A90D9" stroke-width="6" stroke-linecap="round"/>
  <!-- node-2 (green): roughly 120° to 240° -->
  <path d="M180,82 A160,160 0 0,1 180,358" fill="none" stroke="#7BC67E" stroke-width="6" stroke-linecap="round"/>
  <!-- node-3 (amber): roughly 240° to 360° -->
  <path d="M180,358 A160,160 0 0,1 420,220" fill="none" stroke="#E8A838" stroke-width="6" stroke-linecap="round"/>

  <!-- Node labels on ring -->
  <circle cx="420" cy="220" r="8" fill="#4A90D9"/>
  <text x="438" y="224" font-weight="bold" fill="#4A90D9">node-1</text>

  <circle cx="180" cy="82" r="8" fill="#7BC67E"/>
  <text x="120" y="72" font-weight="bold" fill="#7BC67E">node-2</text>

  <circle cx="180" cy="358" r="8" fill="#E8A838"/>
  <text x="120" y="380" font-weight="bold" fill="#E8A838">node-3</text>

  <!-- Virtual node indicators (small dots) -->
  <circle cx="340" cy="86" r="3" fill="#4A90D9" opacity="0.5"/>
  <circle cx="390" cy="130" r="3" fill="#4A90D9" opacity="0.5"/>
  <circle cx="410" cy="280" r="3" fill="#7BC67E" opacity="0.5"/>
  <circle cx="300" cy="375" r="3" fill="#7BC67E" opacity="0.5"/>
  <circle cx="110" cy="240" r="3" fill="#E8A838" opacity="0.5"/>
  <circle cx="130" cy="180" r="3" fill="#E8A838" opacity="0.5"/>
  <circle cx="360" cy="340" r="3" fill="#E8A838" opacity="0.5"/>
  <circle cx="270" cy="62" r="3" fill="#4A90D9" opacity="0.5"/>

  <!-- Channel lookups -->
  <!-- Channel A — hashes to node-1 territory -->
  <circle cx="370" cy="160" r="5" fill="#333"/>
  <text x="378" y="152" font-size="11" fill="#333">ch-A</text>
  <line x1="370" y1="165" x2="390" y2="135" stroke="#666" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowhead)"/>

  <!-- Channel B — hashes to node-3 territory -->
  <circle cx="230" cy="365" r="5" fill="#333"/>
  <text x="238" y="375" font-size="11" fill="#333">ch-B</text>
  <line x1="230" y1="360" x2="200" y2="360" stroke="#666" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowhead)"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Consistent Hash Ring</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#888">SHA-256 → 64-bit position, 128 virtual nodes per physical node</text>

  <!-- Legend -->
  <text x="20" y="430" font-size="11" fill="#888">Each channel ID hashes to a ring position → walks clockwise to the next node = owner</text>
</svg>
