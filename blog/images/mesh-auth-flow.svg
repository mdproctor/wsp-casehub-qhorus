<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#475569"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="400" fill="#fafaf9" rx="8"/>

  <!-- HTTP Request -->
  <rect x="30" y="165" width="120" height="50" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
  <text x="90" y="194" text-anchor="middle" fill="#f8fafc" font-weight="600">HTTP Request</text>

  <!-- Decision diamond -->
  <polygon points="240,140 300,190 240,240 180,190" fill="#fff" stroke="#475569" stroke-width="1.5"/>
  <text x="240" y="186" text-anchor="middle" fill="#1e293b" font-size="11">Bearer</text>
  <text x="240" y="200" text-anchor="middle" fill="#1e293b" font-size="11">token?</text>

  <!-- Arrow: request to diamond -->
  <line x1="150" y1="190" x2="176" y2="190" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- OIDC box -->
  <rect x="340" y="90" width="150" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="415" y="112" text-anchor="middle" fill="#1e40af" font-weight="600" font-size="12">quarkus-oidc</text>
  <text x="415" y="128" text-anchor="middle" fill="#1e40af" font-size="11">JWT verification</text>

  <!-- API Key box -->
  <rect x="340" y="240" width="150" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="415" y="262" text-anchor="middle" fill="#92400e" font-weight="600" font-size="12">API Key Mechanism</text>
  <text x="415" y="278" text-anchor="middle" fill="#92400e" font-size="11">X-Api-Key header</text>

  <!-- Arrow: diamond to OIDC (yes) -->
  <line x1="270" y1="156" x2="270" y2="115" stroke="#475569" stroke-width="1.5"/>
  <line x1="270" y1="115" x2="336" y2="115" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="275" y="142" fill="#475569" font-size="11">yes</text>

  <!-- Arrow: diamond to API Key (no) -->
  <line x1="270" y1="224" x2="270" y2="265" stroke="#475569" stroke-width="1.5"/>
  <line x1="270" y1="265" x2="336" y2="265" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="275" y="250" fill="#475569" font-size="11">no</text>

  <!-- SecurityIdentity box -->
  <rect x="540" y="152" width="150" height="56" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="615" y="175" text-anchor="middle" fill="#166534" font-weight="600" font-size="12">SecurityIdentity</text>
  <text x="615" y="193" text-anchor="middle" fill="#166534" font-size="11">actorId + tenancyId</text>

  <!-- Arrow: OIDC to SecurityIdentity -->
  <line x1="490" y1="115" x2="540" y2="115" stroke="#16a34a" stroke-width="1.5"/>
  <line x1="540" y1="115" x2="540" y2="148" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Arrow: API Key to SecurityIdentity -->
  <line x1="490" y1="265" x2="540" y2="265" stroke="#16a34a" stroke-width="1.5"/>
  <line x1="540" y1="265" x2="540" y2="212" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- CurrentPrincipal box -->
  <rect x="540" y="310" width="150" height="50" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="615" y="332" text-anchor="middle" fill="#581c87" font-weight="600" font-size="12">CurrentPrincipal</text>
  <text x="615" y="348" text-anchor="middle" fill="#581c87" font-size="11">trust · ledger · ACLs</text>

  <!-- Arrow: SecurityIdentity to CurrentPrincipal -->
  <line x1="615" y1="208" x2="615" y2="306" stroke="#9333ea" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SPI label on API Key -->
  <rect x="370" y="296" width="90" height="22" rx="4" fill="#fef9c3" stroke="#eab308" stroke-width="1"/>
  <text x="415" y="311" text-anchor="middle" fill="#854d0e" font-size="10" font-weight="500">SPI boundary</text>

  <!-- 401 rejection path -->
  <text x="240" y="290" text-anchor="middle" fill="#dc2626" font-size="11">neither →</text>
  <text x="240" y="305" text-anchor="middle" fill="#dc2626" font-weight="600" font-size="12">401</text>

  <!-- Priority labels -->
  <text x="415" y="82" text-anchor="middle" fill="#64748b" font-size="10">priority ~1000 (tried first)</text>
  <text x="415" y="302" text-anchor="middle" fill="#64748b" font-size="10">priority 2000 (fallback)</text>
</svg>
