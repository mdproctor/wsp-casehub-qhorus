<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="pubGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A90D9" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#4A90D9" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="privGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8833A" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#E8833A" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="dmGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#50B86C" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#50B86C" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#333">Channel Visibility — What It Controls</text>

  <!-- PUBLIC column -->
  <rect x="20" y="50" width="220" height="320" rx="8" fill="url(#pubGrad)" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="130" y="75" text-anchor="middle" font-size="14" font-weight="600" fill="#4A90D9">PUBLIC</text>
  <text x="130" y="95" text-anchor="middle" font-size="11" fill="#666">Discoverable, open membership</text>

  <rect x="35" y="115" width="190" height="40" rx="4" fill="white" stroke="#4A90D9" stroke-width="1"/>
  <text x="130" y="132" text-anchor="middle" font-size="11" fill="#333">Society broadcast</text>
  <text x="130" y="146" text-anchor="middle" font-size="10" fill="#888">capability announcements</text>

  <rect x="35" y="165" width="190" height="40" rx="4" fill="white" stroke="#4A90D9" stroke-width="1"/>
  <text x="130" y="182" text-anchor="middle" font-size="11" fill="#333">Open discussion</text>
  <text x="130" y="196" text-anchor="middle" font-size="10" fill="#888">any agent can join</text>

  <text x="130" y="230" text-anchor="middle" font-size="10" fill="#4A90D9" font-style="italic">Default: BROADCAST + OPEN</text>

  <!-- PRIVATE column -->
  <rect x="250" y="50" width="220" height="320" rx="8" fill="url(#privGrad)" stroke="#E8833A" stroke-width="1.5"/>
  <text x="360" y="75" text-anchor="middle" font-size="14" font-weight="600" fill="#E8833A">PRIVATE</text>
  <text x="360" y="95" text-anchor="middle" font-size="11" fill="#666">Managed membership, group-bound</text>

  <rect x="265" y="115" width="190" height="40" rx="4" fill="white" stroke="#E8833A" stroke-width="1"/>
  <text x="360" y="132" text-anchor="middle" font-size="11" fill="#333">Group internal comms</text>
  <text x="360" y="146" text-anchor="middle" font-size="10" fill="#888">boundGroupId links to org unit</text>

  <rect x="265" y="165" width="190" height="40" rx="4" fill="white" stroke="#E8833A" stroke-width="1"/>
  <text x="360" y="182" text-anchor="middle" font-size="11" fill="#333">Inter-group coordination</text>
  <text x="360" y="196" text-anchor="middle" font-size="10" fill="#888">coordinator-to-coordinator</text>

  <text x="360" y="230" text-anchor="middle" font-size="10" fill="#E8833A" font-style="italic">Default: APPEND + ENFORCE</text>

  <!-- DIRECT column -->
  <rect x="480" y="50" width="220" height="320" rx="8" fill="url(#dmGrad)" stroke="#50B86C" stroke-width="1.5"/>
  <text x="590" y="75" text-anchor="middle" font-size="14" font-weight="600" fill="#50B86C">DIRECT</text>
  <text x="590" y="95" text-anchor="middle" font-size="11" fill="#666">Exactly 2 members, immutable</text>

  <rect x="495" y="115" width="190" height="40" rx="4" fill="white" stroke="#50B86C" stroke-width="1"/>
  <text x="590" y="132" text-anchor="middle" font-size="11" fill="#333">Agent-to-agent DM</text>
  <text x="590" y="146" text-anchor="middle" font-size="10" fill="#888">dm/alice/bob (sorted, deduped)</text>

  <rect x="495" y="165" width="190" height="40" rx="4" fill="white" stroke="#50B86C" stroke-width="1"/>
  <text x="590" y="182" text-anchor="middle" font-size="11" fill="#333">Agent mail inbox</text>
  <text x="590" y="196" text-anchor="middle" font-size="10" fill="#888">findDirectChannelsFor(me)</text>

  <text x="590" y="230" text-anchor="middle" font-size="10" fill="#50B86C" font-style="italic">Default: APPEND + ENFORCE</text>

  <!-- Bottom: normative layer -->
  <rect x="20" y="260" width="680" height="100" rx="8" fill="#F5F5F5" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="360" y="285" text-anchor="middle" font-size="13" font-weight="600" fill="#555">Normative Layer — Unchanged Regardless of Visibility</text>
  <text x="360" y="308" text-anchor="middle" font-size="11" fill="#777">Speech acts · Commitments · Ledger · Trust · Attestation · Watchdog</text>
  <text x="360" y="328" text-anchor="middle" font-size="11" fill="#777">MessageService.dispatch() does not check visibility</text>
  <text x="360" y="348" text-anchor="middle" font-size="10" fill="#999" font-style="italic">A COMMAND in a DM creates the same obligation as a COMMAND in a broadcast channel</text>
</svg>
