<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <marker id="esc-arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#64748b" stroke-width="1.2"/>
    </marker>
    <marker id="esc-fail" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#dc2626" stroke-width="1.2"/>
    </marker>
    <marker id="esc-ok" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#16a34a" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="24" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Escalation walks the org tree</text>

  <!-- Level 0: Division -->
  <rect x="260" y="50" width="200" height="44" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="360" y="68" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">Engineering Division</text>
  <text x="360" y="82" text-anchor="middle" font-size="9" fill="#64748b">director-1 (manager)</text>

  <!-- Level 1: Two teams -->
  <!-- Team Alpha -->
  <rect x="60" y="140" width="240" height="130" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="180" y="160" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">Team Alpha</text>
  <text x="180" y="175" text-anchor="middle" font-size="9" fill="#64748b">supervisor-alpha</text>

  <!-- Alpha agents -->
  <rect x="80" y="190" width="90" height="32" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="125" y="210" text-anchor="middle" font-size="9" fill="#14532d">coder-1</text>

  <rect x="190" y="190" width="90" height="32" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="235" y="210" text-anchor="middle" font-size="9" fill="#14532d">reviewer-1</text>

  <text x="180" y="250" text-anchor="middle" font-size="9" fill="#dc2626" font-weight="500">no analyst here</text>

  <!-- Team Beta -->
  <rect x="420" y="140" width="240" height="130" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="540" y="160" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a">Team Beta</text>
  <text x="540" y="175" text-anchor="middle" font-size="9" fill="#64748b">supervisor-beta</text>

  <!-- Beta agents -->
  <rect x="440" y="190" width="90" height="32" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="485" y="210" text-anchor="middle" font-size="9" fill="#1e3a5f">analyst-2</text>

  <rect x="550" y="190" width="90" height="32" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="595" y="210" text-anchor="middle" font-size="9" fill="#1e3a5f">coder-2</text>

  <!-- Hierarchy lines -->
  <line x1="360" y1="94" x2="180" y2="140" stroke="#94a3b8" stroke-width="1"/>
  <line x1="360" y1="94" x2="540" y2="140" stroke="#94a3b8" stroke-width="1"/>

  <!-- Step 1: coder-1 sends role:analyst -->
  <rect x="20" y="310" width="180" height="36" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1"/>
  <text x="110" y="325" text-anchor="middle" font-size="9" font-weight="600" fill="#713f12">1. coder-1 sends</text>
  <text x="110" y="338" text-anchor="middle" font-size="9" fill="#713f12">target: "role:analyst"</text>

  <!-- Arrow from step 1 up to Team Alpha -->
  <path d="M 150 310 L 180 270" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#esc-fail)" stroke-dasharray="5,3"/>
  <text x="190" y="295" font-size="8" fill="#dc2626" font-weight="500">NoneQualified</text>

  <!-- Step 2: Escalate up -->
  <rect x="200" y="310" width="180" height="36" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1"/>
  <text x="290" y="325" text-anchor="middle" font-size="9" font-weight="600" fill="#713f12">2. escalate(coder-1,</text>
  <text x="290" y="338" text-anchor="middle" font-size="9" fill="#713f12">analyst, tenancy)</text>

  <!-- Arrow from step 2 up to Division -->
  <path d="M 290 310 L 330 96" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#esc-arrow)"/>
  <text x="280" y="200" font-size="8" fill="#64748b" transform="rotate(-60, 280, 200)">walk up org tree</text>

  <!-- Step 3: Found analyst-2 in Beta -->
  <rect x="430" y="310" width="180" height="36" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="520" y="325" text-anchor="middle" font-size="9" font-weight="600" fill="#166534">3. Found analyst-2</text>
  <text x="520" y="338" text-anchor="middle" font-size="9" fill="#166534">strategy: eidos-org-escalated</text>

  <!-- Arrow from Division down to analyst-2 -->
  <path d="M 400 94 L 485 190" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#esc-ok)"/>

  <!-- Highlight analyst-2 -->
  <rect x="437" y="187" width="96" height="38" rx="7" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="4,2"/>

  <!-- Legend -->
  <line x1="40" y1="390" x2="70" y2="390" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="78" y="394" font-size="8" fill="#64748b">No local match</text>

  <line x1="180" y1="390" x2="210" y2="390" stroke="#64748b" stroke-width="1.5"/>
  <text x="218" y="394" font-size="8" fill="#64748b">Org tree walk</text>

  <line x1="320" y1="390" x2="350" y2="390" stroke="#16a34a" stroke-width="1.5"/>
  <text x="358" y="394" font-size="8" fill="#64748b">Escalated match</text>
</svg>
