<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="820" height="420" rx="8" fill="#f8f9fa"/>

  <!-- BEFORE panel -->
  <rect x="20" y="20" width="370" height="380" rx="6" fill="white" stroke="#dee2e6"/>
  <text x="205" y="50" text-anchor="middle" font-size="14" font-weight="bold" fill="#495057">BEFORE — Stateless protocols</text>

  <!-- Dispatch pipeline -->
  <rect x="60" y="80" width="290" height="36" rx="4" fill="#e3f2fd" stroke="#90caf9"/>
  <text x="205" y="103" text-anchor="middle" font-size="12" fill="#1565c0">dispatch(message)</text>

  <line x1="205" y1="116" x2="205" y2="140" stroke="#90caf9" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Query messages -->
  <rect x="60" y="140" width="290" height="36" rx="4" fill="#fff3e0" stroke="#ffb74d"/>
  <text x="205" y="163" text-anchor="middle" font-size="11" fill="#e65100">query 50 recent messages + commitments</text>

  <line x1="205" y1="176" x2="205" y2="200" stroke="#ffb74d" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

  <!-- Build context -->
  <rect x="60" y="200" width="290" height="36" rx="4" fill="#fff3e0" stroke="#ffb74d"/>
  <text x="205" y="223" text-anchor="middle" font-size="11" fill="#e65100">build ProtocolContext from scratch</text>

  <line x1="205" y1="236" x2="205" y2="260" stroke="#ffb74d" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

  <!-- Evaluate -->
  <rect x="60" y="260" width="290" height="36" rx="4" fill="#e8f5e9" stroke="#81c784"/>
  <text x="205" y="283" text-anchor="middle" font-size="12" fill="#2e7d32">protocol.evaluate(context)</text>

  <line x1="205" y1="296" x2="205" y2="320" stroke="#81c784" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Result -->
  <rect x="60" y="320" width="290" height="36" rx="4" fill="#e8f5e9" stroke="#81c784"/>
  <text x="205" y="343" text-anchor="middle" font-size="11" fill="#2e7d32">List&lt;DispatchAdvisory&gt; — derived each time</text>

  <!-- No state label -->
  <text x="205" y="380" text-anchor="middle" font-size="10" fill="#9e9e9e" font-style="italic">No persistent state. No lifecycle. Pure function.</text>

  <!-- AFTER panel -->
  <rect x="430" y="20" width="370" height="380" rx="6" fill="white" stroke="#dee2e6"/>
  <text x="615" y="50" text-anchor="middle" font-size="14" font-weight="bold" fill="#495057">AFTER — Stateful protocols</text>

  <!-- Channel created -->
  <rect x="470" y="75" width="290" height="30" rx="4" fill="#ede7f6" stroke="#b39ddb"/>
  <text x="615" y="95" text-anchor="middle" font-size="11" fill="#4527a0">channel created → onInit(context)</text>

  <line x1="615" y1="105" x2="615" y2="125" stroke="#b39ddb" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <!-- State machine warm -->
  <rect x="470" y="125" width="290" height="30" rx="4" fill="#fce4ec" stroke="#ef9a9a"/>
  <text x="615" y="145" text-anchor="middle" font-size="11" fill="#b71c1c">state machine initialised and warm</text>

  <line x1="615" y1="155" x2="615" y2="175" stroke="#ef9a9a" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <!-- Dispatch -->
  <rect x="470" y="175" width="290" height="30" rx="4" fill="#e3f2fd" stroke="#90caf9"/>
  <text x="615" y="195" text-anchor="middle" font-size="11" fill="#1565c0">dispatch → fire(event) into state machine</text>

  <line x1="615" y1="205" x2="615" y2="225" stroke="#90caf9" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Advisories from state -->
  <rect x="470" y="225" width="290" height="30" rx="4" fill="#e8f5e9" stroke="#81c784"/>
  <text x="615" y="245" text-anchor="middle" font-size="11" fill="#2e7d32">advisories from current state — O(1)</text>

  <line x1="615" y1="255" x2="615" y2="275" stroke="#81c784" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Persist on transition -->
  <rect x="470" y="275" width="290" height="30" rx="4" fill="#fff3e0" stroke="#ffb74d"/>
  <text x="615" y="295" text-anchor="middle" font-size="11" fill="#e65100">state persisted on transition (durable)</text>

  <line x1="615" y1="305" x2="615" y2="325" stroke="#b39ddb" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <!-- Channel deleted -->
  <rect x="470" y="325" width="290" height="30" rx="4" fill="#ede7f6" stroke="#b39ddb"/>
  <text x="615" y="345" text-anchor="middle" font-size="11" fill="#4527a0">channel deleted → onDestroy(id, proto)</text>

  <!-- Lifecycle label -->
  <text x="615" y="380" text-anchor="middle" font-size="10" fill="#9e9e9e" font-style="italic">Full lifecycle. Durable state. Temporal awareness.</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#90caf9"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#ffb74d"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#81c784"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#b39ddb"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#ef9a9a"/>
    </marker>
  </defs>
</svg>
